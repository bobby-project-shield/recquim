name: RebornRec Server v2

on:
  workflow_dispatch:

concurrency:
  group: rebornrec-server2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install WineHQ + tools
        run: |
          set -e
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl unzip tmux xvfb ca-certificates gnupg wget software-properties-common
          sudo dpkg --add-architecture i386
          wget -qO /tmp/winehq.key https://dl.winehq.org/wine-builds/winehq.key
          sudo gpg --dearmor -o /usr/share/keyrings/winehq.gpg /tmp/winehq.key
          CODENAME=$(. /etc/os-release && echo $VERSION_CODENAME)
          echo "deb [signed-by=/usr/share/keyrings/winehq.gpg] https://dl.winehq.org/wine-builds/ubuntu/ ${CODENAME} main" | sudo tee /etc/apt/sources.list.d/winehq.list
          sudo apt-get update -y
          sudo apt-get install -y --install-recommends winehq-stable || sudo apt-get install -y wine64
          echo "wine version:"; wine --version

      - name: Download RebornRec 5.2.0
        run: |
          set -e
          curl -sL -o /tmp/rr.zip https://github.com/aqquad/RebornRec/releases/download/v5.2.0/RebornRec_5.2.0.zip
          mkdir -p "$HOME/rebornrec"
          unzip -oq /tmp/rr.zip -d "$HOME/rebornrec/"
          if [ ! -f "$HOME/rebornrec/RebornRec.exe" ]; then
            sub=$(find "$HOME/rebornrec" -maxdepth 2 -name RebornRec.exe | head -1)
            [ -n "$sub" ] && cp -r "$(dirname "$sub")/." "$HOME/rebornrec/"
          fi
          test -f "$HOME/rebornrec/RebornRec.exe"

      - name: Point hostname at loopback
        run: |
          set +e
          HN=$(hostname)
          echo "hostname resolved:"; getent hosts "$HN"
          sudo cp /etc/hosts /tmp/hosts.bak 2>/dev/null
          grep -vE "[[:space:]]${HN}([[:space:]]|$)" /tmp/hosts.bak > /tmp/hosts.new 2>/dev/null
          echo "127.0.0.1 ${HN}" >> /tmp/hosts.new
          sudo tee /etc/hosts < /tmp/hosts.new >/dev/null
          rm -f /tmp/hosts.new /tmp/hosts.bak
          getent hosts "$HN"
          echo ok

      - name: Boot Wine + RebornRec
        run: |
          B64=''
          echo "$B64" | base64 -d > /tmp/step.sh
          bash /tmp/step.sh
