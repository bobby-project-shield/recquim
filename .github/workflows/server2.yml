name: RebornRec Server v2

on:
  workflow_dispatch:

concurrency:
  group: rebornrec-server2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine + tools
        run: |
          set -e
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl unzip tmux xvfb winbind ca-certificates gnupg wget
          wget -qO- https://dl.winehq.org/wine-builds/winehq.key | gpg --dearmor | sudo tee /usr/share/keyrings/winehq.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/winehq.gpg] https://dl.winehq.org/wine-builds/ubuntu/ $(. /etc/os-release && echo $VERSION_CODENAME) main" | sudo tee /etc/apt/sources.list.d/winehq.list >/dev/null
          sudo apt-get update -y || true
          sudo apt-get install -y --install-recommends winehq-stable || sudo apt-get install -y wine64
          wine --version || wine64 --version

      - name: Download RebornRec 5.2.0
        run: |
          set -e
          curl -sL -o /tmp/rr.zip https://github.com/aqquad/RebornRec/releases/download/v5.2.0/RebornRec_5.2.0.zip
          mkdir -p "$HOME/rebornrec"
          unzip -oq /tmp/rr.zip -d "$HOME/rebornrec/"
          if [ ! -f "$HOME/rebornrec/RebornRec.exe" ]; then
            sub=$(find "$HOME/rebornrec" -maxdepth 2 -name RebornRec.exe | head -1)
            [ -n "$sub" ] && cp -r "$(dirname "$sub")/." "$HOME/rebornrec/"
          fi
          test -f "$HOME/rebornrec/RebornRec.exe"

      - name: Point hostname at loopback
        run: |
          set +e
          HN=$(hostname)
          echo "hostname: $HN"
          getent hosts "$HN" || true
          sudo cp /etc/hosts /tmp/hosts.bak 2>/dev/null
          grep -vE "[[:space:]]${HN}([[:space:]]|$)" /tmp/hosts.bak > /tmp/hosts.new 2>/dev/null
          echo "127.0.0.1 ${HN}" >> /tmp/hosts.new
          sudo tee /etc/hosts < /tmp/hosts.new >/dev/null
          rm -f /tmp/hosts.new /tmp/hosts.bak
          echo "after:"; getent hosts "$HN" || true
          echo "step ok"

      - name: Boot Wine + RebornRec, dump diag
        run: |
          set +e
          export DISPLAY=:99
          export WINEDEBUG=-all
          DIAG=/tmp/diag.txt
          : > "$DIAG"
          echo "=== START $(date -u +%FT%TZ) ===" >> "$DIAG"
          echo "wine: $(wine --version 2>&1)" >> "$DIAG"
          echo "rebornrec dir:" >> "$DIAG"
          ls "$HOME/rebornrec" >> "$DIAG" 2>&1
          Xvfb :99 -screen 0 1280x720x24 >/tmp/xvfb.log 2>&1 &
          sleep 3
          echo "--- wineboot -u ---" >> "$DIAG"
          wineboot -u >> "$DIAG" 2>&1
          echo "wineboot exit=$?" >> "$DIAG"
          sleep 10
          echo "--- launch RebornRec in tmux ---" >> "$DIAG"
          tmux new -d -s rr -x 200 -y 50 "cd \$HOME/rebornrec && DISPLAY=:99 WINEDEBUG=-all wine RebornRec.exe 2>&1 | tee -a /tmp/rr.log"
          sleep 100
          echo "--- pane after 100s ---" >> "$DIAG"
          tmux capture-pane -t rr -p >> "$DIAG" 2>&1
          echo "--- send key 5 ---" >> "$DIAG"
          tmux send-keys -t rr -l 5
          sleep 30
          echo "--- pane after key5 ---" >> "$DIAG"
          tmux capture-pane -t rr -p >> "$DIAG" 2>&1
          echo "--- listening ports ---" >> "$DIAG"
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E '2056|2059' >> "$DIAG" 2>&1
          echo "--- probes ---" >> "$DIAG"
          for h in "127.0.0.1:2056" "$(hostname):2056"; do
            c=$(curl -s -m6 -o /dev/null -w '%{http_code}' -H "Host: $h" http://127.0.0.1:2056/ || true)
            echo "Host $h -> $c" >> "$DIAG"
          done
          echo "--- rr.log ---" >> "$DIAG"
          tail -80 /tmp/rr.log >> "$DIAG" 2>&1
          echo "=== END $(date -u +%FT%TZ) ===" >> "$DIAG"
          cp "$DIAG" diag.txt
          git config user.name "recquim-server"
          git config user.email "recquim-server@users.noreply.github.com"
          git add -f diag.txt
          git commit -m "diag $(date -u +%FT%TZ)" || true
          git push origin HEAD:main || true
          cat "$DIAG"
