name: server

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: rebornrec-server
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Wine
        run: |
          set -e
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl unzip tmux xvfb ca-certificates gnupg wget
          sudo dpkg --add-architecture i386
          wget -qO /tmp/w.key https://dl.winehq.org/wine-builds/winehq.key
          sudo gpg --dearmor -o /usr/share/keyrings/winehq.gpg /tmp/w.key
          CN=$(. /etc/os-release && echo $VERSION_CODENAME)
          echo "deb [signed-by=/usr/share/keyrings/winehq.gpg] https://dl.winehq.org/wine-builds/ubuntu/ ${CN} main" | sudo tee /etc/apt/sources.list.d/winehq.list
          sudo apt-get update -y
          sudo apt-get install -y --install-recommends winehq-stable || sudo apt-get install -y wine64
          wine --version

      - name: RebornRec
        run: |
          set -e
          curl -sL -o /tmp/rr.zip https://github.com/aqquad/RebornRec/releases/download/v5.2.0/RebornRec_5.2.0.zip
          mkdir -p "$HOME/rebornrec"
          unzip -oq /tmp/rr.zip -d "$HOME/rebornrec/"
          if [ ! -f "$HOME/rebornrec/RebornRec.exe" ]; then
            sub=$(find "$HOME/rebornrec" -maxdepth 2 -name RebornRec.exe | head -1)
            [ -n "$sub" ] && cp -r "$(dirname "$sub")/." "$HOME/rebornrec/"
          fi
          test -f "$HOME/rebornrec/RebornRec.exe"

      - name: Serve
        run: |
          echo "" | base64 -d > /tmp/step.sh
          timeout -k 15 20500 bash /tmp/step.sh || echo "step rc=$?"
          echo "----- diag.txt -----"
          tail -c 4000 diag.txt || true
