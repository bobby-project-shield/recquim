name: RebornRec Server

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: rebornrec-server
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine + tools
        run: |
          set -e
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl unzip tmux xvfb winbind ca-certificates gnupg wget
          wget -qO- https://dl.winehq.org/wine-builds/winehq.key | gpg --dearmor | sudo tee /usr/share/keyrings/winehq.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/winehq.gpg] https://dl.winehq.org/wine-builds/ubuntu/ $(. /etc/os-release && echo $VERSION_CODENAME) main" | sudo tee /etc/apt/sources.list.d/winehq.list >/dev/null
          sudo apt-get update -y || true
          sudo apt-get install -y --install-recommends winehq-stable || sudo apt-get install -y wine64
          wine --version || wine64 --version

      - name: Download RebornRec 5.2.0
        run: |
          set -e
          curl -sL -o /tmp/rr.zip https://github.com/aqquad/RebornRec/releases/download/v5.2.0/RebornRec_5.2.0.zip
          mkdir -p "$HOME/rebornrec"
          unzip -oq /tmp/rr.zip -d "$HOME/rebornrec/"
          if [ ! -f "$HOME/rebornrec/RebornRec.exe" ]; then
            sub=$(find "$HOME/rebornrec" -maxdepth 2 -name RebornRec.exe | head -1)
            [ -n "$sub" ] && cp -r "$(dirname "$sub")/." "$HOME/rebornrec/"
          fi
          test -f "$HOME/rebornrec/RebornRec.exe"

      - name: Point hostname at loopback
        run: |
          set +e
          HN=$(hostname)
          echo "hostname: $HN"
          getent hosts "$HN" || true
          sudo cp /etc/hosts /tmp/hosts.bak 2>/dev/null
          grep -vE "[[:space:]]${HN}([[:space:]]|$)" /tmp/hosts.bak > /tmp/hosts.new 2>/dev/null
          echo "127.0.0.1 ${HN}" >> /tmp/hosts.new
          sudo tee /etc/hosts < /tmp/hosts.new >/dev/null
          rm -f /tmp/hosts.new /tmp/hosts.bak
          echo "after:"; getent hosts "$HN" || true
          echo "step ok"

      - name: Start RebornRec
        run: |
          set +e
          Xvfb :99 -screen 0 1280x720x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          tmux new -d -s rr -x 200 -y 50 "cd $HOME/rebornrec && DISPLAY=:99 WINEDEBUG=-all wine RebornRec.exe 2>&1 | tee -a /tmp/rr.log"
          sleep 55
          tmux send-keys -t rr -l 5
          sleep 12
          echo "--- probe ---"
          for h in "127.0.0.1:2056" "$(hostname):2056"; do
            code=$(curl -s -m6 -o /dev/null -w '%{http_code}' -H "Host: $h" http://127.0.0.1:2056/ || true)
            echo "Host $h -> $code"
          done
          echo "--- listening ---"
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E '2056|2059' || echo "no 2056/2059 yet"
          echo "--- last log ---"
          tail -25 /tmp/rr.log || true
          echo "step ok"

      - name: Start tunnel and publish origin
        run: |
          set +e
          curl -sL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          HH="127.0.0.1:2056"
          for h in "127.0.0.1:2056" "$(hostname):2056"; do
            code=$(curl -s -m5 -o /dev/null -w '%{http_code}' -H "Host: $h" http://127.0.0.1:2056/ || true)
            if [ "$code" = "200" ]; then HH="$h"; break; fi
          done
          echo "using http-host-header: $HH"
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:2056 --http-host-header "$HH" --no-autoupdate >/tmp/tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "tunnel: $URL"
          if [ -z "$URL" ]; then
            echo "TUNNEL FAILED"; tail -40 /tmp/tunnel.log; exit 1
          fi
          echo "$URL" > origin.txt
          git config user.name "recquim-server"
          git config user.email "recquim-server@users.noreply.github.com"
          git add origin.txt
          git commit -m "origin $(date -u +%FT%TZ)" || true
          git push origin HEAD:main || true

      - name: Watchdog
        run: |
          set +e
          HH="127.0.0.1:2056"
          for i in $(seq 1 320); do
            code=$(curl -s -m5 -o /dev/null -w '%{http_code}' -H "Host: $HH" http://127.0.0.1:2056/stupid/api/version || true)
            if [ "$code" != "200" ]; then
              echo "[$(date -u +%FT%TZ)] API=$code, restarting app"
              tmux kill-session -t rr 2>/dev/null
              pkill -f 'RebornRec.ex[e]' 2>/dev/null
              sleep 3
              tmux new -d -s rr -x 200 -y 50 "cd $HOME/rebornrec && DISPLAY=:99 WINEDEBUG=-all wine RebornRec.exe 2>&1 | tee -a /tmp/rr.log"
              sleep 55
              tmux send-keys -t rr -l 5
            fi
            sleep 60
          done
          echo "shift change"
